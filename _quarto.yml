project:
  type: website
  output-dir: _output

# Configuration globale pour TOUS les fichiers HTML
format:
  html:
    # Thème de base
    theme: default
    
    # Votre fichier SCSS personnalisé
    scss: custom.scss
    
    # Votre feuille de styles CSS supplémentaire
    css: styles.css
    
    # Options de mise en page
    toc: true
    toc-location: right
    toc-depth: 3
    number-sections: true
    
    # Typographie et spacing
    linestretch: 1.5
    
    # Code highlighting
    code-block-bg: true
    code-block-border-left: true
    
    # Autres options utiles
    embed-resources: true
    self-contained: false
    smooth-scroll: true
